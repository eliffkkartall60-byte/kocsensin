<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KoçSensin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7fc;
      color: #171927;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .card {
      width: 100%;
      max-width: 900px;
      padding: 70px 50px;
      text-align: center;
      background: white;
      border-radius: 28px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.08);
    }

    .logo {
      color: #5b4df7;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 52px;
      margin: 0 0 20px;
    }

    h1 span {
      color: #5b4df7;
    }

    p {
      max-width: 600px;
      margin: auto;
      font-size: 19px;
      line-height: 1.6;
      color: #666b7a;
    }

    button {
      margin-top: 35px;
      padding: 16px 30px;
      border: none;
      border-radius: 12px;
      background: #5b4df7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="logo">KoçSensin</div>

      <h1>
        Kendi planını oluştur.<br>
        <span>Kendi koçun ol.</span>
      </h1>

      <p>
        Derslerini planla, konularını ve kaynaklarını takip et,
        yanlışlarını kaydet ve gelişimini tek bir yerde gör.
      </p>

      <button>Hemen Başla</button>

    </div>
  </div>

</body>
</html>
